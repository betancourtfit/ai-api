name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    # F-02: permissions moved here from workflow level. verify is the required
    # check (ruleset require-ci-on-master) and must never inherit registry
    # write access — contents: read is all it needs.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      # The Dockerfile and this workflow now agree on 1.3.11 (bumped together in
      # .planning/quick/260724-rp0-dockerfile-bun-1-3-11-job-de-build-de-im/).
      # 1.3.11 is the floor because Bun before v1.1.39 cannot read this repo's
      # text `bun.lock` format and silently resolves from package.json's `^`
      # ranges instead. If either pin moves, bump the other in the same change.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      # .env.test is the one tracked env file and is deliberately allowlisted:
      # Bun auto-loads it under `bun test`, giving CI deterministic config with
      # no repo secret values. Its contents were human-verified (Task 3 of the quick
      # task that introduced this workflow) to hold fixtures only, never live keys.
      - name: Guard - no secret env files tracked
        run: |
          tracked="$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -vE '(^|/)\.env\.(example|test)$' || true)"
          if [ -n "$tracked" ]; then
            echo "::error::Tracked secret env file(s) detected outside the allowlist (.env.example, .env.test)"
            printf '%s\n' "$tracked"
            exit 1
          fi
          echo "OK: no tracked env files outside the allowlist (.env.example, .env.test)"

          # This repo is PUBLIC. .env.test is permanently allowlisted *by name*
          # above, so name-based allowlisting alone cannot detect a live key
          # pasted into it. The gate below scans every allowlisted tracked env
          # file for known credential prefixes without ever printing a value:
          # only the file name and a provider label are ever emitted, because
          # this CI log is public.

          # Anti-vacuous self-test first. A quoting or regex regression must
          # never silently turn this gate into a no-op, the same failure mode
          # the dependency-audit guard (docker-image job) guards against for
          # its own threshold. The synthetic token is written to a file with
          # printf, never echoed into the log.
          selftest="$RUNNER_TEMP/env-scan-selftest"
          printf 'GROQ_API_KEY=gsk_%s\n' "0123456789abcdefghij" > "$selftest"
          if ! grep -qE 'gsk_[A-Za-z0-9]{20,}' "$selftest"; then
            echo "::error::credential scanner self-test failed — the gate is vacuous"
            rm -f "$selftest"
            exit 1
          fi
          rm -f "$selftest"

          # An empty result here is a legitimate state (no allowlisted env
          # file tracked yet), not a failure.
          allowlisted="$(git ls-files | grep -E '(^|/)\.env\.(example|test)$' || true)"

          leak=0
          if [ -n "$allowlisted" ]; then
            while IFS= read -r file; do
              [ -z "$file" ] && continue
              # label:regex pairs. The (^|[^A-Za-z0-9]) anchor on the OpenAI
              # pattern is load-bearing: without it, every Cerebras csk-...
              # key also trips the OpenAI pattern, because csk- contains sk-.
              # The {20,} floor is what keeps placeholders like sk-xxxx or
              # csk-REPLACE_ME from firing.
              for spec in \
                "Groq:gsk_[A-Za-z0-9]{20,}" \
                "Cerebras:csk-[A-Za-z0-9]{20,}" \
                "OpenAI:(^|[^A-Za-z0-9])sk-[A-Za-z0-9_-]{20,}" \
                "AWS:AKIA[A-Z0-9]{16}"
              do
                label="${spec%%:*}"
                pattern="${spec#*:}"
                if grep -qE "$pattern" "$file"; then
                  echo "::error::Possible live $label credential in tracked file $file — rotate it and remove it from the file (value deliberately not printed)"
                  leak=1
                fi
              done
            done <<EOF
          $allowlisted
          EOF
          fi

          if [ "$leak" -ne 0 ]; then
            exit 1
          fi

          echo "OK: no live-credential prefixes in the allowlisted env files"

  # Builds the production image and audits it on every push to master, but never
  # on a pull request — needs: verify so a red test suite short-circuits the
  # ~15 min build instead of wasting runner time on a doomed image. This job is
  # deliberately NOT a required status check, so PRs are not slowed down by it.
  docker-image:
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # F-02: packages: write is scoped to this job alone — the only job that
    # pushes to GHCR — so verify, the required check, never inherits registry
    # write access. The repo's default_workflow_permissions is read, so this
    # grant must be explicit here.
    permissions:
      contents: read
      packages: write
    # IMAGE is a static string (not an expression), so it never reaches a
    # run: body as an interpolation — safe under constraint 1.
    env:
      IMAGE: ghcr.io/betancourtfit/ai-api
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      # load: true is load-bearing: with push: false alone the built image stays
      # inside the buildx cache and never reaches the local docker daemon, so the
      # next step's `docker run` would fail with "image not found". CACHEBUST is
      # set to the commit SHA so this build never silently reuses a stale app
      # layer from a previous run's cache.
      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: bun-ai-api:ci
          build-args: |
            CACHEBUST=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # T-ukq-05: this is the invariant the publish step re-checks before
      # pushing. Recording it immediately after the build, before any smoke
      # runs, is what lets the publish step later prove the pushed bits are
      # the exact object every smoke ran against — not a rebuild.
      - name: Record the smoked image id
        run: |
          set -euo pipefail

          # No leading $ on the braces below -- {{.Id}} is Go template syntax
          # for `docker image inspect`, not a GitHub expression.
          image_id="$(docker image inspect bun-ai-api:ci --format '{{.Id}}')"

          # Anti-vacuous: an unparseable id must never pass silently.
          if ! printf '%s' "$image_id" | grep -qE '^sha256:[0-9a-f]{64}$'; then
            echo "::error::Could not read a plausible image id (got: '$image_id')"
            exit 1
          fi

          echo "Smoked image id: $image_id"
          echo "SMOKED_IMAGE_ID=$image_id" >> "$GITHUB_ENV"

      # Absolute, non-decaying floor on the image's own Bun binary. 1.1.39 is
      # the release that introduced the text lockfile format, so this floor
      # never has to move — unlike the dependency-drift audit below, which can
      # only detect drift for as long as versions newer than the current pins
      # exist upstream to drift toward.
      - name: Verify image Bun version
        run: |
          set -euo pipefail

          bun_version="$(docker run --rm --entrypoint bun bun-ai-api:ci --version | tr -d '[:space:]')"
          echo "Image Bun version: $bun_version"

          # Anti-vacuous: an unreadable version string must never pass silently.
          if ! printf '%s' "$bun_version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Could not parse a semver Bun version from the image (got: '$bun_version')"
            exit 1
          fi

          min="1.1.39"
          lowest="$(printf '%s\n%s\n' "$min" "$bun_version" | sort -V | head -n1)"
          if [ "$lowest" != "$min" ]; then
            echo "::error::Image Bun version $bun_version is below the floor $min — Bun before 1.1.39 cannot read this repo's text bun.lock and silently resolves from package.json's ^ ranges instead"
            exit 1
          fi

          echo "OK: image Bun $bun_version >= $min"

      # This is the step that makes the whole job worth its runtime: it catches
      # Bun < 1.1.39 silently ignoring the text bun.lock and resolving from the
      # `^` ranges in package.json instead, so `--frozen-lockfile` exits 0 having
      # installed drifted versions. The assertion lives here, in CI, rather than
      # as a RUN inside the Dockerfile, because a CI-only check does not belong
      # baked into the production image.
      - name: Verify image deps match bun.lock
        run: |
          set -euo pipefail

          # --entrypoint bun keeps start.sh (and the whisper-server sidecar) from
          # launching; WORKDIR /app is inherited from the image.
          docker run --rm --entrypoint bun bun-ai-api:ci pm ls > image-deps.txt
          echo "---- raw bun pm ls output ----"
          cat image-deps.txt

          # Strip leading whitespace and the multi-byte tree-drawing prefix
          # (without depending on a UTF-8 locale), then keep only bare
          # name@version tokens, dropping the "/app node_modules (N)" header and
          # any Bun env-autoload notice. `|| true` stops a no-match grep from
          # aborting under pipefail before the guard below can report it.
          deps="$(sed -E 's/^[^A-Za-z@]*//' image-deps.txt \
            | grep -E '^@?[A-Za-z0-9._/-]+@[0-9]' \
            | sort -u || true)"

          count="$(printf '%s\n' "$deps" | grep -c . || true)"
          echo "Parsed $count dependency tokens from the image."

          # Anti-vacuous guard, derived from package.json instead of a
          # hardcoded literal so a legitimate dependency removal moves both
          # numbers together instead of this check reporting a false
          # "check is vacuous". peerDependencies must be included in the sum
          # because typescript lives there and does appear in `bun pm ls`.
          # jq is preinstalled on ubuntu-latest.
          expected="$(jq -r '[(.dependencies//{}), (.devDependencies//{}), (.peerDependencies//{})] | map(keys) | add | unique | length' package.json)"
          if ! printf '%s' "$expected" | grep -qE '^[0-9]+$' || [ "$expected" -lt 1 ]; then
            echo "::error::Could not derive the direct-dependency count from package.json"
            exit 1
          fi
          if [ "$count" -ne "$expected" ]; then
            echo "::error::Dependency audit parsed $count package(s) from the image but package.json declares $expected direct dependenc(ies) — the audit is not covering the declared inventory"
            exit 1
          fi
          if ! printf '%s\n' "$deps" | grep -q '^@cerebras/cerebras_cloud_sdk@'; then
            echo "::error::@cerebras/cerebras_cloud_sdk is missing from the image's dependency listing"
            exit 1
          fi
          if ! printf '%s\n' "$deps" | grep -q '^groq-sdk@'; then
            echo "::error::groq-sdk is missing from the image's dependency listing"
            exit 1
          fi

          # bun.lock stores every resolved package as a verbatim quoted
          # "name@version" token, so a hit means the image installed exactly
          # what the lockfile pins and a miss means it drifted. Collect every
          # mismatch before failing so one run reports all drift, not just the
          # first hit.
          failed=0
          while IFS= read -r dep; do
            [ -z "$dep" ] && continue
            if grep -qF "\"$dep\"" bun.lock; then
              echo "OK   $dep"
            else
              echo "::error::$dep is installed in the image but is not the version bun.lock pins"
              failed=1
            fi
          done <<EOF
          $deps
          EOF

          if [ "$failed" -ne 0 ]; then
            exit 1
          fi

          echo "Success: all $count image dependencies match bun.lock."

      # Quick task 260724-mv1 moved the whisper model out of the image and
      # into a runtime volume provisioned by ensure-model.sh. This step is
      # the proof: it gates the image's own size and structurally confirms
      # no ggml-*.bin blob crept back in, before any container is even
      # started.
      - name: Verify the image ships no whisper model
        run: |
          set -euo pipefail

          # ORDER IS DELIBERATE: the structural check runs FIRST because it is
          # the precise one -- it answers "is a model in the image?" directly.
          # The size gate is a coarse tripwire whose threshold is an estimate,
          # so it must never be able to fail the job before the precise check
          # has reported. Run 30136048728 is why: the size ceiling was set
          # from a bad estimate, tripped at 709 MiB, and exited before the
          # find ever ran -- leaving "is the model gone?" unanswered by the
          # one check that could actually answer it.

          # Structural gate: ggml-*.bin (not *.bin) so a data file inside
          # node_modules can never produce a false positive.
          found="$(docker run --rm --entrypoint sh bun-ai-api:ci -c 'find /app /models -name "ggml-*.bin" -type f 2>/dev/null' || true)"
          if [ -n "$found" ]; then
            echo "::error::Found whisper model file(s) baked into the image:"
            printf '%s\n' "$found"
            exit 1
          fi

          # Anti-vacuous companion: prove `find` actually works inside this
          # image and /app is the right root, so a broken find invocation
          # above cannot silently read as "no model found".
          package_json_hit="$(docker run --rm --entrypoint sh bun-ai-api:ci -c 'find /app -maxdepth 1 -name "package.json" -type f 2>/dev/null' || true)"
          package_json_count="$(printf '%s\n' "$package_json_hit" | grep -c . || true)"
          if [ "$package_json_count" -ne 1 ]; then
            echo "::error::Anti-vacuous probe failed: expected exactly one /app/package.json, found $package_json_count -- the find-based model gate above cannot be trusted"
            exit 1
          fi

          echo "OK: no ggml-*.bin anywhere in the image, find probe confirmed working"

          # Coarse tripwire, deliberately generous. It exists only to catch a
          # model-sized blob sneaking back in through a path the find above
          # does not cover (a differently-named model file, a stray copy
          # outside /app and /models). It is NOT a size-optimisation budget --
          # a base-image or ffmpeg update legitimately moves this number, and
          # a gate that fails on ordinary drift gets muted, which is worse
          # than no gate.
          #
          # No leading $ on the braces below -- {{.Size}} is Go template
          # syntax for `docker image inspect`, not a GitHub expression.
          size_bytes="$(docker image inspect bun-ai-api:ci --format '{{.Size}}')"
          size_mib="$(( size_bytes / 1024 / 1024 ))"
          echo "Image size: ${size_bytes} bytes (~${size_mib} MiB)"

          # Anti-vacuous floor: a parse failure yielding an empty or
          # non-numeric value (which would compare as 0) must never pass
          # silently as "small enough".
          if ! printf '%s' "$size_bytes" | grep -qE '^[0-9]+$' || [ "$size_bytes" -lt 104857600 ]; then
            echo "::error::Could not read a plausible image size (got: '$size_bytes') -- the size gate is not covering the real image"
            exit 1
          fi

          # Measured on run 30136048728: 709 MiB with the model already out of
          # the image. That is the real baseline -- the pre-existing "~350 MiB
          # expected" figure was an estimate that ignored the uncompressed
          # Debian base (~250 MiB) plus ffmpeg's dependency tree. ggml-small
          # is 466 MiB, so any re-entry lands near 1175 MiB; a 900 MiB ceiling
          # sits clear of normal drift and still trips well before that.
          if [ "$size_bytes" -ge 943718400 ]; then
            echo "::error::Image is ${size_mib} MiB, at or above the 900 MiB ceiling -- a model-sized blob may have re-entered the image through a path the find gate does not cover"
            exit 1
          fi
          echo "OK: image size ${size_mib} MiB is below the 900 MiB ceiling"

      # T-ukq-01: the gate that makes going *public* safe (F-08 — the GHCR
      # package will be world-readable). On CI the build context is a clean
      # actions/checkout of an already-public repo, so a public image exposes
      # nothing that is not already public on GitHub. .dockerignore excludes
      # .env and .env.local by exact name only, so this is the tripwire for a
      # future .env.production-style file. The credential-prefix scan over the
      # two allowlisted files is not duplicated here: needs: verify already
      # ran it against the byte-identical tracked files at this same commit.
      - name: Verify the image ships no unexpected env file
        run: |
          set -euo pipefail

          found="$(docker run --rm --entrypoint sh bun-ai-api:ci -c 'find /app -maxdepth 2 -name ".env*" -type f 2>/dev/null' || true)"
          if [ -n "$found" ]; then
            failed=0
            while IFS= read -r path; do
              [ -z "$path" ] && continue
              case "$path" in
                /app/.env.example|/app/.env.test)
                  ;;
                *)
                  echo "::error::Unexpected env file baked into the image: $path"
                  failed=1
                  ;;
              esac
            done <<EOF
          $found
          EOF
            if [ "$failed" -ne 0 ]; then
              exit 1
            fi
          fi
          echo "OK: no unexpected .env* files in the image"

          # Anti-vacuous companion, mirroring the probe already used by the
          # whisper-model gate above: prove `find` actually works inside this
          # image and /app is the right root, so a broken find invocation
          # cannot silently read as "no env files found".
          package_json_hit="$(docker run --rm --entrypoint sh bun-ai-api:ci -c 'find /app -maxdepth 1 -name "package.json" -type f 2>/dev/null' || true)"
          package_json_count="$(printf '%s\n' "$package_json_hit" | grep -c . || true)"
          if [ "$package_json_count" -ne 1 ]; then
            echo "::error::Anti-vacuous probe failed: expected exactly one /app/package.json, found $package_json_count -- the find-based env-file gate above cannot be trusted"
            exit 1
          fi
          echo "OK: find probe confirmed working"

      # The only step here that can hang: without a timeout a wedged container
      # burns runner minutes until the 6-hour job default. This step starts the
      # production image under its REAL entrypoint (start.sh) for the first
      # time ever in CI — the existing step above deliberately overrides the
      # entrypoint precisely so start.sh does not launch.
      - name: Smoke - run the real container
        timeout-minutes: 10
        run: |
          set -euo pipefail

          # Literal dummy values only — this smoke never makes a real upstream
          # call, so a real key must never be used here.
          #
          # PERSONAL_PROXY_API_KEY is needed twice: the Bearer gate on
          # /v1/audio/transcriptions (a POST_AUTH_ROUTES entry) and
          # proxyKeyConfigured inside getReadiness — without it /ready is
          # {ready:false, mode:"not_configured"} and returns 503.
          #
          # CEREBRAS_API_KEY / GROQ_API_KEY: only their *presence* matters
          # (buildContainer passes Boolean(cfg.cerebrasApiKey) into the store's
          # configured map). Without them eligibleProviders is empty and
          # /ready is 503.
          #
          # WHISPER_MODEL_ALIAS: buildContainer picks HttpWhisperService only
          # when this is non-null, and handleTranscriptions 400s unless the
          # request's model field equals it exactly.
          #
          # WHISPER_TIMEOUT_MS: the default is 30000ms and an ~11s clip on a
          # 2-vCPU runner with a GGML_NATIVE=OFF build of ggml-small.bin can
          # exceed it, turning a healthy container into a 503.
          #
          # Do NOT pass -e HOSTNAME. Docker sets HOSTNAME to the container ID
          # and config.hostname reads it, so the app binds the container's own
          # IP — which is exactly what production does today. Overriding it
          # would mask production behaviour.
          #
          # -v smoke-models:/models (Docker creates the named volume on
          # demand) plus the three tiny-model overrides is D-02: CI proves
          # the real download/verify/install mechanism with the 77 MB tiny
          # model while production defaults to the 466 MB small model. All
          # three overrides must move together.
          docker run -d --name smoke -p 3001:3001 \
            -v smoke-models:/models \
            -e PERSONAL_PROXY_API_KEY=ci-smoke-not-a-real-key \
            -e CEREBRAS_API_KEY=ci-dummy-cerebras \
            -e GROQ_API_KEY=ci-dummy-groq \
            -e WHISPER_MODEL_ALIAS=whisper-1 \
            -e WHISPER_TIMEOUT_MS=180000 \
            -e WHISPER_MODEL_PATH=/models/ggml-tiny.bin \
            -e WHISPER_MODEL_URL=https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.bin \
            -e WHISPER_MODEL_SHA256=be07e048e1e599ad46341c8d2a135645097a538221678b7acdd1b1919c6e1b21 \
            bun-ai-api:ci

          # Wait for liveness via retries, never a fixed sleep. On each
          # iteration, assert the container is still alive first — the braces
          # below carry no leading $, so GitHub Actions does not treat them as
          # an expression, and the `|| echo false` stops a removed container
          # from aborting the step under set -e. A dead container fails fast
          # here instead of polling a port that will never open until the
          # step timeout.
          up=0
          for i in $(seq 1 60); do
            running="$(docker inspect -f '{{.State.Running}}' smoke 2>/dev/null || echo false)"
            if [ "$running" != "true" ]; then
              echo "::error::container exited during startup"
              exit 1
            fi
            if curl -fsS -m 2 http://127.0.0.1:3001/health >/dev/null 2>&1; then
              up=1
              break
            fi
            sleep 1
          done
          if [ "$up" -ne 1 ]; then
            echo "::error::/health never answered within 60s"
            exit 1
          fi

          # Assert the build stamp. This is the assertion closing the
          # build-args CACHEBUST -> ARG CACHEBUST -> ENV BUILD_VERSION ->
          # handleHealth chain, which has been fed by the build for two runs
          # with nothing ever verifying it reaches runtime. GITHUB_SHA is read
          # as a plain runner environment variable, deliberately NOT as a
          # GitHub expression -- an expression is interpolated anywhere inside
          # a run: block, including on lines that look like shell comments, so
          # writing one here (even to describe it) is a workflow syntax error.
          health="$(curl -fsS -m 5 http://127.0.0.1:3001/health)"
          expected_health="ok ${GITHUB_SHA}"
          if [ "$health" != "$expected_health" ]; then
            echo "::error::/health returned '$health', expected '$expected_health'"
            exit 1
          fi
          echo "OK: /health == $expected_health"

          # Assert readiness. Both dummy provider keys are present, so a
          # "degraded" result means the store's configured map did not see
          # them. whisperAvailable is captured but never gated on here —
          # whisper.cpp's own GET /health may 404 on the pinned v1.7.6 build,
          # and the 77 MB tiny model, downloading into the smoke-models
          # volume in the background subshell, may still be loading here.
          ready_body="$(curl -fsS -m 10 http://127.0.0.1:3001/ready)"
          echo "$ready_body"
          echo "$ready_body" | jq -e '.ready == true' >/dev/null
          echo "$ready_body" | jq -e '.mode == "ok"' >/dev/null
          whisper_available="$(printf '%s' "$ready_body" | jq -r '.whisperAvailable')"

          # Transcribe for real. whisper-models/sample.wav comes from the
          # runner's actions/checkout (tracked, 352KB, RIFF WAVE 16-bit mono
          # 16kHz), so nothing needs to be copied into the container and the
          # ffmpeg --convert path is not involved. The `|| echo 000` on the
          # curl call is required: under set -e a connection error would
          # otherwise abort the step instead of retrying.
          code=""
          attempt=0
          while [ "$attempt" -lt 24 ]; do
            attempt=$((attempt + 1))
            code="$(curl -s -o "$RUNNER_TEMP/smoke-transcription.json" -w '%{http_code}' -m 240 \
              -X POST http://127.0.0.1:3001/v1/audio/transcriptions \
              -H "Authorization: Bearer ci-smoke-not-a-real-key" \
              -F "file=@whisper-models/sample.wav" \
              -F "model=whisper-1" || echo 000)"
            if [ "$code" = "200" ]; then
              break
            fi
            # 503 (whisper still loading — HttpWhisperService.transcribe fails
            # fast on connection refused) and 000 (curl-level failure) retry.
            # Every other code is terminal.
            if [ "$code" = "503" ] || [ "$code" = "000" ]; then
              sleep 5
              continue
            fi
            echo "::error::transcription request returned terminal status $code"
            cat "$RUNNER_TEMP/smoke-transcription.json" || true
            exit 1
          done
          if [ "$code" != "200" ]; then
            echo "::error::transcription never returned 200 after 24 attempts"
            exit 1
          fi

          # Assert the transcript exists, not what it says — this is the only
          # assertion that proves whisper-server survived start.sh's
          # background &. /health returns ok <sha> unconditionally and never
          # touches whisper, so a /health-only smoke is a structural false
          # green. Content is deliberately not asserted because the sample is
          # English while the production default is WHISPER_LANGUAGE=es.
          jq -e '(.text | type == "string") and ((.text | length) > 0)' "$RUNNER_TEMP/smoke-transcription.json" >/dev/null
          excerpt="$(jq -r '.text' "$RUNNER_TEMP/smoke-transcription.json" | cut -c1-200)"
          echo "Transcript excerpt: $excerpt"

          # A free diagnostic, never a failure. On a COLD boot this is the
          # expected reading, not a defect: /ready is polled while the model
          # is still downloading in start.sh's background subshell, so
          # whisper-server has not been launched yet and health() cannot
          # succeed. The transcription below runs seconds later, once the
          # model has landed. Run 30134777498 -- back when the model was
          # baked into the image and whisper-server started immediately --
          # reported whisperAvailable:true, which is what rules out the
          # other candidate explanation (that the pinned v1.7.6 build has no
          # GET /health endpoint). Production sees this same window on the
          # first boot after the volume is empty.
          if [ "$whisper_available" != "true" ]; then
            echo "::warning::/ready reported whisperAvailable=false while a real transcription succeeded — expected on a cold boot: the model was still downloading when /ready was polled, so whisper-server had not started yet"
          fi

          # D-09: the transcription above proves whisper-server started, but
          # not that it started from a model this run actually downloaded --
          # a pre-seeded volume could pass the same assertions. These two
          # log markers are the proof that the real cold-download code path
          # ran, not just the cache-hit path.
          cold_logs="$(docker logs smoke 2>&1)"
          if ! printf '%s' "$cold_logs" | grep -qF 'whisper-model: downloading from'; then
            echo "::error::container logs never showed 'whisper-model: downloading from' -- the cold download path did not run"
            exit 1
          fi
          if ! printf '%s' "$cold_logs" | grep -qF 'whisper-model: install ok at'; then
            echo "::error::container logs never showed 'whisper-model: install ok at' -- the model was never installed"
            exit 1
          fi
          echo "OK: cold boot proved the real download + install path"

      # D-09: the cold smoke above proves the download path; this step
      # proves the two paths that run on every subsequent boot. Both
      # containers share the same populated smoke-models volume from the
      # cold boot above, on ports that do not collide with the still-running
      # `smoke` container. whisper-server binds 127.0.0.1:8080 inside each
      # container's own network namespace, so there is no sidecar port
      # conflict between the three containers.
      - name: Smoke - warm boot and degraded boot
        timeout-minutes: 5
        run: |
          set -euo pipefail

          # Warm: same tiny-model overrides as the cold container, on the
          # same volume -- this is the path that runs on every production
          # boot after the first.
          docker run -d --name smoke-warm -p 3002:3001 \
            -v smoke-models:/models \
            -e PERSONAL_PROXY_API_KEY=ci-smoke-not-a-real-key \
            -e CEREBRAS_API_KEY=ci-dummy-cerebras \
            -e GROQ_API_KEY=ci-dummy-groq \
            -e WHISPER_MODEL_ALIAS=whisper-1 \
            -e WHISPER_TIMEOUT_MS=180000 \
            -e WHISPER_MODEL_PATH=/models/ggml-tiny.bin \
            -e WHISPER_MODEL_URL=https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.bin \
            -e WHISPER_MODEL_SHA256=be07e048e1e599ad46341c8d2a135645097a538221678b7acdd1b1919c6e1b21 \
            bun-ai-api:ci

          up=0
          for i in $(seq 1 60); do
            running="$(docker inspect -f '{{.State.Running}}' smoke-warm 2>/dev/null || echo false)"
            if [ "$running" != "true" ]; then
              echo "::error::smoke-warm exited during startup"
              exit 1
            fi
            if curl -fsS -m 2 http://127.0.0.1:3002/health >/dev/null 2>&1; then
              up=1
              break
            fi
            sleep 1
          done
          if [ "$up" -ne 1 ]; then
            echo "::error::smoke-warm /health never answered within 60s"
            exit 1
          fi

          # Provisioning runs in a background subshell (D-04), so the cache
          # hit marker can trail /health by a moment -- poll the logs rather
          # than asserting immediately.
          warm_cache_hit=0
          for i in $(seq 1 30); do
            if docker logs smoke-warm 2>&1 | grep -qF 'whisper-model: cache hit at'; then
              warm_cache_hit=1
              break
            fi
            sleep 1
          done
          if [ "$warm_cache_hit" -ne 1 ]; then
            echo "::error::smoke-warm never logged 'whisper-model: cache hit at' within 30s"
            exit 1
          fi

          # Non-vacuous negative assertion: only meaningful once the cache
          # hit marker above has actually been observed.
          warm_logs="$(docker logs smoke-warm 2>&1)"
          if printf '%s' "$warm_logs" | grep -qF 'whisper-model: downloading from'; then
            echo "::error::smoke-warm re-downloaded the model instead of hitting the cache"
            exit 1
          fi
          echo "OK: warm boot hit the cache without downloading"

          # Degraded: a real 404 URL and a path the volume has never seen.
          # The dummy proxy/provider keys and the tiny checksum value stay
          # the same -- only the model source is broken.
          docker run -d --name smoke-degraded -p 3003:3001 \
            -v smoke-models:/models \
            -e PERSONAL_PROXY_API_KEY=ci-smoke-not-a-real-key \
            -e CEREBRAS_API_KEY=ci-dummy-cerebras \
            -e GROQ_API_KEY=ci-dummy-groq \
            -e WHISPER_MODEL_ALIAS=whisper-1 \
            -e WHISPER_TIMEOUT_MS=180000 \
            -e WHISPER_MODEL_PATH=/models/ggml-absent.bin \
            -e WHISPER_MODEL_URL=https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-nope.bin \
            -e WHISPER_MODEL_SHA256=be07e048e1e599ad46341c8d2a135645097a538221678b7acdd1b1919c6e1b21 \
            bun-ai-api:ci

          up=0
          for i in $(seq 1 60); do
            running="$(docker inspect -f '{{.State.Running}}' smoke-degraded 2>/dev/null || echo false)"
            if [ "$running" != "true" ]; then
              echo "::error::smoke-degraded exited during startup"
              exit 1
            fi
            if curl -fsS -m 2 http://127.0.0.1:3003/health >/dev/null 2>&1; then
              up=1
              break
            fi
            sleep 1
          done
          if [ "$up" -ne 1 ]; then
            echo "::error::smoke-degraded /health never answered within 60s"
            exit 1
          fi

          degraded_health="$(curl -fsS -m 5 http://127.0.0.1:3003/health)"
          expected_health="ok ${GITHUB_SHA}"
          if [ "$degraded_health" != "$expected_health" ]; then
            echo "::error::smoke-degraded /health returned '$degraded_health', expected '$expected_health'"
            exit 1
          fi
          echo "OK: smoke-degraded /health == $expected_health"

          degraded_unavailable=0
          for i in $(seq 1 30); do
            if docker logs smoke-degraded 2>&1 | grep -qF 'whisper-model: unavailable:'; then
              degraded_unavailable=1
              break
            fi
            sleep 1
          done
          if [ "$degraded_unavailable" -ne 1 ]; then
            echo "::error::smoke-degraded never logged 'whisper-model: unavailable:' within 30s"
            exit 1
          fi
          echo "OK: smoke-degraded logged the provisioning failure"

          # D-05: the container must survive the failure rather than
          # crash-loop. The cold step's real transcription is what keeps
          # this whisperAvailable:false check from being a vacuous result --
          # this run proves the *same image* transcribes for real when
          # provisioning succeeds.
          sleep 10
          running="$(docker inspect -f '{{.State.Running}}' smoke-degraded 2>/dev/null || echo false)"
          if [ "$running" != "true" ]; then
            echo "::error::smoke-degraded is no longer running 10s after the provisioning failure -- it crash-looped"
            exit 1
          fi
          echo "OK: smoke-degraded is still running 10s after the provisioning failure"

          degraded_ready_body="$(curl -fsS -m 10 http://127.0.0.1:3003/ready)"
          echo "$degraded_ready_body"
          echo "$degraded_ready_body" | jq -e '.ready == true' >/dev/null
          echo "$degraded_ready_body" | jq -e '.whisperAvailable == false' >/dev/null
          echo "OK: smoke-degraded /ready reports ready==true, whisperAvailable==false -- degradation is observable, not silent"

      # Plain `docker login`, not a third-party action -- no new supply-chain
      # dependency for three lines (T-ukq-SC). No PAT: the package will be
      # public and the push is made by the repo's own token (F-03).
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      # T-ukq-05: publishes by re-tagging and pushing the same local
      # bun-ai-api:ci object every smoke above ran against -- never a second
      # build, never push: true on the build step. $GITHUB_SHA and
      # $GITHUB_ACTOR are plain runner environment variables (constraint 1).
      - name: Publish image to GHCR
        run: |
          set -euo pipefail

          # Re-assert the invariant recorded right after the build: what is
          # about to be published must still be the exact object every smoke
          # above ran, not a rebuild.
          current_id="$(docker image inspect bun-ai-api:ci --format '{{.Id}}')"
          if [ "$current_id" != "$SMOKED_IMAGE_ID" ]; then
            echo "::error::Image id changed between the smoked build and publish ($SMOKED_IMAGE_ID -> $current_id) -- refusing to publish an image that was never smoked"
            exit 1
          fi
          echo "OK: publishing the exact image every smoke ran against ($current_id)"

          docker tag bun-ai-api:ci "$IMAGE:$GITHUB_SHA"
          docker tag bun-ai-api:ci "$IMAGE:latest"

          # Both tags pushed unconditionally: this job already carries
          # if: github.event_name == 'push', and the workflow only triggers
          # push on master, so :latest here always means "newest master
          # build" -- not an accidental promotion of a PR or branch build.
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:latest"

          # Safe to log: the package is public. This digest is the rollback
          # handle referenced in README.md.
          digest="$(docker image inspect "$IMAGE:$GITHUB_SHA" --format '{{index .RepoDigests 0}}')"
          echo "Rollback handle (repo digest): $digest"

          docker logout ghcr.io >/dev/null 2>&1 || true

      # Must sit after the smoke steps and before cleanup, otherwise the
      # containers are already gone when it runs. if: failure() rather than
      # always() keeps green runs quiet. Safe to print: the app's structured
      # logger emits metadata only, never keys, prompts, responses, or
      # transcripts (CLAUDE.md #19), and every credential in these containers
      # is a dummy anyway. Each `|| true` stops a container that was never
      # created from aborting this step.
      - name: Smoke - container logs on failure
        if: failure()
        run: |
          docker logs smoke || true
          docker logs smoke-warm || true
          docker logs smoke-degraded || true

      # Always runs so a failed smoke never leaks a running container or
      # volume into a subsequent step or a self-hosted runner. Container
      # removal has to come first -- `docker volume rm` refuses while a
      # container still references the volume.
      - name: Smoke - remove containers and volume
        if: always()
        run: |
          docker rm -f smoke smoke-warm smoke-degraded || true
          docker volume rm -f smoke-models || true
